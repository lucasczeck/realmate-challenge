[pytest]
# Configuração do pytest para Django
DJANGO_SETTINGS_MODULE = realmate_challenge.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --reuse-db
    --nomigrations
testpaths = 
    api/tests
    BO/tests
    core
markers =
    slow: marca testes que são lentos
    integration: marca testes de integração
    unit: marca testes unitários
